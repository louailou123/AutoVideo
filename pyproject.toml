[project]
name = "autovideo"
version = "0.1.0"
description = "Turn a voice file and ordered images into a video, each image timed by its spoken words."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "av<19",  # PyAV 19 refuses the metadata_errors argument faster-whisper 1.2 passes to av.open
]

[project.gui-scripts]
autovideo = "autovideo.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autovideo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ffmpeg: needs FFmpeg installed (real video encode)"]
